<ehcache     
    name="Mitra">    
    <diskStore         
        path="./cacheStore/Mitra"/>    
    <defaultCache         
        maxEntriesLocalHeap="0"/>    
    <cache         
        name="getMitra"         
        eternal="true"
        copyOnRead="false"
        copyOnWrite="false"         
        maxEntriesLocalHeap="1000"         
        overflowToOffHeap="false"         
        cacheLoaderTimeoutMillis="30000">        
        <persistence             
            strategy="none"/>        
        <elementValueComparator             
            class="com.wm.app.b2b.server.util.data.ehcache.EhcacheDataValueComparator"/>    
    </cache>
</ehcache>
