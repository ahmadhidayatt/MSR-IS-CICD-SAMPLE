
<ehcache     
        name="CACHE.GENERATOR">
	<diskStore         
            path="./cacheStore/CACHE.GENERATOR"/>
	<defaultCache         
            maxEntriesLocalHeap="0"/>
	<cache         
            name="listGenerateReport"         
            maxEntriesLocalHeap="10000"         
            timeToLiveSeconds="300" 
            copyOnRead="false"
            copyOnWrite="false"        
            overflowToOffHeap="false"         
            cacheLoaderTimeoutMillis="30000">
		<persistence             
                strategy="none"/>
	</cache>
	<cache         
            name="scaleTask"         
            maxEntriesLocalHeap="10000"         
            timeToLiveSeconds="300"
            copyOnRead="false"
            copyOnWrite="false"
            overflowToOffHeap="false"         
            cacheLoaderTimeoutMillis="30000">
		<persistence             
                strategy="none"/>
	</cache>
</ehcache>
